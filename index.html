<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2447d8">
<title>الجدول الدراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fa; --card:#fff; --ink:#141a2e; --mut:#5f6784; --line:#dfe3ee;
  --acc:#2447d8; --acc-ink:#fff; --soft:#e8ecf7; --lum:46%;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1120; --card:#171c30; --ink:#eef0fa; --mut:#9aa2c0; --line:#2a3150;
        --acc:#7b97ff; --acc-ink:#0d1120; --soft:#1f2640; --lum:64%}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* sticky top bar */
.bar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:700}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
  min-height:44px;cursor:pointer;font-size:13px;font-weight:500}
.who i{font-style:normal;color:var(--mut);padding-inline-start:6px;border-inline-start:1px solid var(--line)}
.who span+span{padding-inline-start:6px;border-inline-start:1px solid var(--line)}

/* picker */
.picker{padding:4px 0 14px}
.step{margin-top:10px}
.step h2{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
@media (max-width:639px){
  .step .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
  .step .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
}

/* day tabs (phones) */
.tabs{display:flex;gap:6px;padding:0 0 10px}
.tab{flex:1;min-width:0;min-height:52px;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tab b{font-size:13px;font-weight:600;white-space:nowrap}
.tab small{font-size:11px;color:var(--mut)}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tab[aria-selected=true] small{color:inherit;opacity:.85}
.tab.today b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:currentColor;margin-inline-start:4px;vertical-align:middle}

/* day panels */
main{padding:14px 0 40px}
.days{display:grid;gap:16px}
.day{display:none}
.day.active{display:block}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 10px}
.dayhead h2{font-size:16px;margin:0;font-weight:700;display:none}
.dayhead p{margin:0;font-size:13px;color:var(--mut)}
.list{display:grid;gap:10px}
.none{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--mut);font-size:14px}

/* class card */
.ev{--c:hsl(var(--h) 62% var(--lum));display:grid;grid-template-columns:56px 1fr;gap:12px;
  background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);
  border-radius:12px;padding:12px}
.ev.now{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.time{direction:ltr;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.time b{font-size:15px;color:var(--ink);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.head h3{margin:0;font-size:15px;font-weight:600;line-height:1.4}
.tag{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
.tag.now{background:var(--acc);color:var(--acc-ink)}
.tag.warn{background:#fde7d6;color:#9a3d06}
@media (prefers-color-scheme:dark){.tag.warn{background:#4a2a14;color:#ffc9a0}}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--mut);align-items:center}
.loc{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--ink);padding:2px 10px;border-radius:8px;font-weight:500}

/* states */
.state{max-width:420px;margin:60px auto;text-align:center;color:var(--mut);padding:0 16px}
.state p{margin:0 0 14px}
.state code{direction:ltr;display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;color:var(--ink)}
.btn{min-height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:600;cursor:pointer}
.hint{border:1px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;color:var(--mut)}

/* tablet and desktop: every day visible, no tabs */
@media (min-width:820px){
  .tabs{display:none}
  .days{grid-template-columns:repeat(3,1fr);align-items:start}
  .day{display:block}
  .dayhead h2{display:block}
  .day.today .dayhead h2{color:var(--acc)}
  .day.today .dayhead h2::after{content:" (اليوم)";font-size:12px;font-weight:500}
  h1{font-size:22px}
}
@media (min-width:640px) and (max-width:819px){
  .days{max-width:640px;margin:auto}
}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <div class="top">
      <div>
        <h1>الجدول الدراسي</h1>
        <div class="sub">الفصل الدراسي الأول 2026-2027، كلية الحاسبات والمعلومات</div>
      </div>
      <button class="who" id="who" hidden aria-label="تغيير الفرقة أو المجموعة أو السكشن"></button>
    </div>
    <div class="picker" id="picker" hidden>
      <div class="step"><h2>الفرقة</h2><div class="chips" id="s1"></div></div>
      <div class="step" id="w2" hidden><h2>المجموعة / القسم</h2><div class="chips" id="s2"></div></div>
      <div class="step" id="w3" hidden><h2>السكشن</h2><div class="chips" id="s3"></div></div>
    </div>
    <div class="tabs" id="tabs" role="tablist" hidden></div>
  </div>
</div>

<main class="wrap" id="app" aria-live="polite">
  <div class="state"><p>جاري تحميل الجدول…</p></div>
</main>

<script>
const DAYS = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const fmt = h => (h % 12 || 12) + ":00 " + (h < 12 ? "ص" : "م");
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
// JS getDay(): Sun=0..Sat=6  ->  our index: Sat=0..Thu=5, Fri=6 (no classes)
const todayIdx = (new Date().getDay() + 1) % 7;

// the Excel parser leaves stray quotes and Latin gibberish in a few cells
const cleanCourse = s => s.replace(/["“”]/g, "").replace(/\b[a-z]{4,}\b/gi, "").replace(/\s+/g, " ").trim();
const cleanInstr = s => (s && s.replace(/[\s/]/g, "").length > 1) ? s.trim() : "";

const state = { data: null, y: null, g: null, s: null, day: 0, open: true };

/* ---------- loading ---------- */
async function load() {
  const app = $("app");
  app.replaceChildren(Object.assign(el("div", "state"), { innerHTML: "<p>جاري تحميل الجدول…</p>" }));
  try {
    const r = await fetch("schedule.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.data = await r.json();
    if (!state.data.years || !state.data.events) throw new Error("bad format");
  } catch (err) {
    const box = el("div", "state");
    box.append(el("p", "", "تعذّر تحميل ملف الجدول (schedule.json)."));
    if (location.protocol === "file:") {
      const p = el("p", "", "الملف مفتوح مباشرة من الجهاز. شغّل خادمًا محليًا بالأمر: ");
      p.append(el("code", "", "python -m http.server"));
      box.append(p);
    }
    const b = el("button", "btn", "إعادة المحاولة"); b.onclick = load; box.append(b);
    app.replaceChildren(box);
    return;
  }
  restore();
  render();
}

/* ---------- selection: URL hash > localStorage ---------- */
function restore() {
  let saved = {};
  const m = location.hash.slice(1).split("/");
  if (m.length === 3) saved = { y: +m[0], g: m[1], s: +m[2] };
  else { try { saved = JSON.parse(localStorage.getItem("sel") || "{}"); } catch (e) {} }
  const y = state.data.years.find(v => v.id === saved.y);
  const g = y && y.groups.find(v => v.id === saved.g);
  if (y) state.y = y.id;
  if (g) state.g = g.id;
  if (g && g.sections.includes(saved.s)) state.s = saved.s;
  state.open = state.s == null;
  state.day = defaultDay();
}
function persist() {
  const sel = { y: state.y, g: state.g, s: state.s };
  try { localStorage.setItem("sel", JSON.stringify(sel)); } catch (e) {}
  const h = state.s != null ? `#${state.y}/${state.g}/${state.s}` : location.pathname + location.search;
  try { history.replaceState(null, "", h); } catch (e) {}
}
function yearObj() { return state.data.years.find(v => v.id === state.y); }
function groupObj() { const y = yearObj(); return y && y.groups.find(v => v.id === state.g); }

function byDay() {
  const g = groupObj(); const out = DAYS.map(() => []);
  if (!g || state.s == null) return out;
  state.data.events
    .filter(e => e.group === g.id && e.sections.includes(state.s) && out[e.day])
    .sort((a, b) => a.start - b.start || a.end - b.end)
    .forEach(e => out[e.day].push(e));
  return out;
}
function defaultDay() {
  if (todayIdx < DAYS.length) return todayIdx;
  return 0;
}

/* ---------- rendering ---------- */
function chips(host, items, cur, on) {
  host.replaceChildren(...items.map(it => {
    const b = el("button", "chip", it.label);
    b.type = "button"; b.setAttribute("aria-pressed", String(it.id === cur));
    b.onclick = () => on(it.id); return b;
  }));
}

function renderPicker() {
  const y = yearObj(), g = groupObj();
  const complete = state.s != null;
  $("picker").hidden = complete && !state.open;
  $("w2").hidden = !y; $("w3").hidden = !g;
  chips($("s1"), state.data.years.map(v => ({ id: v.id, label: v.name })), state.y, id => {
    state.y = id; state.g = state.s = null; state.open = true; render();
  });
  if (y) chips($("s2"), y.groups.map(v => ({ id: v.id, label: v.name })), state.g, id => {
    state.g = id; state.s = null;
    const grp = groupObj();
    if (grp.sections.length === 1) { state.s = grp.sections[0]; state.open = false; state.day = defaultDay(); }
    render();
  });
  if (g) chips($("s3"), g.sections.map(n => ({ id: n, label: "سكشن " + n })), state.s, id => {
    state.s = id; state.open = false; state.day = defaultDay(); render(); window.scrollTo({ top: 0 });
  });

  const who = $("who");
  who.hidden = !complete;
  if (complete) {
    who.replaceChildren(el("span", "", y.name), el("span", "", g.name), el("span", "", "سكشن " + state.s), el("i", "", state.open ? "إغلاق" : "تغيير"));
    who.setAttribute("aria-expanded", String(state.open));
    who.onclick = () => { state.open = !state.open; renderPicker(); };
  }
}

function renderTabs(days) {
  const tabs = $("tabs");
  const show = state.s != null;
  tabs.hidden = !show;
  if (!show) return;
  tabs.replaceChildren(...DAYS.map((d, i) => {
    const b = el("button", "tab" + (i === todayIdx ? " today" : ""));
    b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(i === state.day));
    b.append(el("b", "", d), el("small", "", days[i].length ? days[i].length + " مواد" : "إجازة"));
    b.onclick = () => { state.day = i; render(); };
    return b;
  }));
}

function summary(list) {
  if (!list.length) return "لا توجد محاضرات";
  return `${list.length} مواد، من ${fmt(list[0].start)} إلى ${fmt(Math.max(...list.map(e => e.end)))}`;
}

function card(e, status, conflict) {
  const a = el("article", "ev" + (status === "now" ? " now" : ""));
  a.style.setProperty("--h", hue(e.course));
  const t = el("div", "time"); t.append(el("b", "", fmt(e.start)), el("span", "", fmt(e.end)));
  const body = el("div");
  const head = el("div", "head"); head.append(el("h3", "", cleanCourse(e.course)));
  if (status === "now") head.append(el("span", "tag now", "الآن"));
  else if (status === "next") head.append(el("span", "tag", "التالي"));
  if (conflict) head.append(el("span", "tag warn", "تعارض"));
  const meta = el("div", "meta");
  if (e.location) meta.append(el("span", "loc", e.location));
  const ins = cleanInstr(e.instructor); if (ins) meta.append(el("span", "", ins));
  body.append(head); if (meta.childNodes.length) body.append(meta);
  a.append(t, body); return a;
}

function renderDays(days) {
  const app = $("app");
  if (state.s == null) { app.replaceChildren(el("div", "hint", "اختر الفرقة ثم المجموعة ثم السكشن لعرض الجدول")); return; }
  const now = new Date(), nowH = now.getHours() + now.getMinutes() / 60;
  const wrap = el("div", "days");
  days.forEach((list, i) => {
    const sec = el("section", "day" + (i === state.day ? " active" : "") + (i === todayIdx ? " today" : ""));
    const head = el("div", "dayhead"); head.append(el("h2", "", DAYS[i]), el("p", "", summary(list)));
    sec.append(head);
    if (!list.length) sec.append(el("div", "none", "يوم بلا محاضرات"));
    else {
      const ul = el("div", "list");
      let nextDone = false;
      list.forEach(e => {
        let st = "";
        if (i === todayIdx) {
          if (nowH >= e.start && nowH < e.end) st = "now";
          else if (nowH < e.start && !nextDone) { st = "next"; nextDone = true; }
        }
        const conflict = list.some(o => o !== e && o.start < e.end && e.start < o.end);
        ul.append(card(e, st, conflict));
      });
      sec.append(ul);
    }
    wrap.append(sec);
  });
  app.replaceChildren(wrap);
}

function render() {
  persist();
  const days = byDay();
  renderPicker(); renderTabs(days); renderDays(days);
}

/* swipe between days on phones */
(() => {
  let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 == null || state.s == null || innerWidth >= 820) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    // RTL: days run right to left, so a swipe to the left moves forward
    const next = state.day + (dx < 0 ? 1 : -1);
    if (next >= 0 && next < DAYS.length) { state.day = next; render(); }
  }, { passive: true });
})();

load();
</script>
</body>
</html>
