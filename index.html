<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الجدول الدراسي</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --mut: #6b6b6b;
      --line: #e2e2e2;
      --soft: #f5f5f5;
      --chip: #111;
      --chipfg: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d0d0d;
        --fg: #f2f2f2;
        --mut: #9a9a9a;
        --line: #2b2b2b;
        --soft: #181818;
        --chip: #f2f2f2;
        --chipfg: #111
      }
    }

    :root[data-theme="dark"] {
      --bg: #0d0d0d;
      --fg: #f2f2f2;
      --mut: #9a9a9a;
      --line: #2b2b2b;
      --soft: #181818;
      --chip: #f2f2f2;
      --chipfg: #111
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      line-height: 1.4
    }

    header {
      padding: 20px 16px 8px;
      max-width: 1100px;
      margin: auto
    }

    h1 {
      font-size: 20px;
      margin: 0 0 2px
    }

    .sub {
      color: var(--mut);
      font-size: 13px
    }

    .step {
      max-width: 1100px;
      margin: auto;
      padding: 10px 16px 0
    }

    .step h2 {
      font-size: 12px;
      font-weight: 600;
      color: var(--mut);
      margin: 0 0 6px;
      letter-spacing: .02em
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 14px;
      cursor: pointer
    }

    .chip[aria-pressed=true] {
      background: var(--chip);
      color: var(--chipfg);
      border-color: var(--chip)
    }

    main {
      max-width: 1100px;
      margin: 16px auto 32px;
      padding: 0 16px
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      color: var(--mut)
    }

    .scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      -webkit-overflow-scrolling: touch
    }

    .mx {
      direction: ltr;
      --w: 112px;
      --lab: 64px;
      width: calc(var(--lab) + 13*var(--w))
    }

    .row {
      display: flex;
      border-bottom: 1px solid var(--line)
    }

    .row:last-child {
      border-bottom: 0
    }

    .lab {
      position: sticky;
      left: 0;
      z-index: 3;
      width: var(--lab);
      flex: none;
      background: var(--soft);
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      direction: rtl
    }

    .head .lab {
      font-weight: 400;
      color: var(--mut)
    }

    .track {
      position: relative;
      flex: 1;
      background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px var(--w))
    }

    .head .track {
      display: flex;
      background: var(--soft)
    }

    .head .t {
      width: var(--w);
      flex: none;
      font-size: 11px;
      color: var(--mut);
      padding: 6px 4px;
      border-left: 1px solid var(--line)
    }

    .ev {
      position: absolute;
      border-radius: 8px;
      padding: 6px 8px;
      overflow: hidden;
      direction: rtl;
      font-size: 12px;
      border: 1px solid rgba(0, 0, 0, .12);
      color: #1a1a1a
    }

    .ev b {
      display: block;
      font-size: 13px;
      line-height: 1.25
    }

    .ev span {
      display: block;
      opacity: .8
    }

    .ev .s {
      margin-top: 2px;
      font-weight: 600
    }

    .note {
      color: var(--mut);
      font-size: 12px;
      margin-top: 8px
    }
  </style>
</head>

structor": "أ.م.د/ ممدوح فاروق", "location": "مدرج اأ" }, { "group": "y4g6", "day": 2, "start": 14, "end": 16, "sections": [1], "course": "الربوتات المعرفية", "instructor": "م/ اية نصار", "location": "معمل 2ج" }, { "group": "y4g6", "day": 3, "start": 14, "end": 16, "sections": [1], "course": "الرؤية بالحاسب", "instructor": "م/ الاء عبدالفتاح", "location": "معمل 3ب" }, { "group": "y4g6", "day": 4, "start": 8, "end": 10, "sections": [1], "course": "الحركة بالحاسب", "instructor": "م / سارة رؤوف", "location": "معمل 2ب" }, { "group": "y4g6", "day": 4, "start": 10, "end": 12, "sections": [1], "course": "تعلم الالة المتقدم", "instructor": "م/ عبدالرحمن جمال", "location": "معمل 4ج" }, { "group": "y4g6", "day": 5, "start": 10, "end": 12, "sections": [1], "course": "معالجة اللغات الطبيعية", "instructor": "م/ منال محمود", "location": "معمل 1د" }, { "group": "y4g6", "day": 5, "start": 12, "end": 14, "sections": [1], "course": "الرؤية بالحاسب", "instructor": "د/ اسماء عباس", "location": "مدرج 2" }] };
    const DAYS = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
    const H0 = 8, H1 = 20, LANE = 74;
    const sel = { y: null, g: null, s: null };
    try { Object.assign(sel, JSON.parse(localStorage.getItem("sel") || "{}")) } catch (e) { }
    const $ = id => document.getElementById(id);
    const fmt = h => (h % 12 || 12) + " " + (h < 12 ? "AM" : "PM");
    const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h };
    function chips(el, items, cur, on) {
      el.innerHTML = "";
      items.forEach(it => {
        const b = document.createElement("button"); b.className = "chip"; b.textContent = it.label;
        b.setAttribute("aria-pressed", String(it.id === cur)); b.onclick = () => on(it.id); el.appendChild(b)
      });
    }
    function render() {
      try { localStorage.setItem("sel", JSON.stringify(sel)) } catch (e) { }
      const y = DATA.years.find(v => v.id === sel.y);
      chips($("s1"), DATA.years.map(v => ({ id: v.id, label: v.name })), sel.y, id => { sel.y = id; sel.g = sel.s = null; render() });
      $("w2").hidden = !y;
      const g = y && y.groups.find(v => v.id === sel.g);
      if (y) chips($("s2"), y.groups.map(v => ({ id: v.id, label: v.name })), sel.g, id => { sel.g = id; sel.s = null; render() });
      $("w3").hidden = !g;
      if (g) chips($("s3"), g.sections.map(n => ({ id: n, label: "سكشن " + n })), sel.s, id => { sel.s = id; render() });
      const out = $("out");
      if (!g || sel.s == null) { out.innerHTML = '<div class="empty">اختر الفرقة ثم المجموعة ثم السكشن لعرض الجدول</div>'; return }
      const evs = DATA.events.filter(e => e.group === g.id && e.sections.includes(sel.s));
      let html = '<div class="scroll"><div class="mx"><div class="row head"><div class="lab"></div><div class="track">';
      for (let h = H0; h < H1; h++)html += `<div class="t">${fmt(h)}</div>`;
      html += '<div class="t" style="width:var(--w)">' + fmt(H1) + '</div></div></div>';
      DAYS.forEach((d, i) => {
        const lanes = []; const de = evs.filter(e => e.day === i).sort((a, b) => a.start - b.start);
        let blocks = "";
        de.forEach(e => {
          let l = lanes.findIndex(end => end <= e.start); if (l < 0) { l = lanes.length; lanes.push(0) } lanes[l] = e.end;
          const hu = hue(e.course), ins = e.instructor.length > 3 ? e.instructor : "";
          const sec = e.sections.length > 1 ? `سكشن ${e.sections[0]}–${e.sections[e.sections.length - 1]}` : `سكشن ${e.sections[0]}`;
          blocks += `<div class="ev" style="left:calc(${e.start - H0}*var(--w) + 2px);width:calc(${e.end - e.start}*var(--w) - 4px);top:${l * LANE + 4}px;height:${LANE - 8}px;background:hsl(${hu} 70% 86%);border-color:hsl(${hu} 40% 70%)"><b>${e.course}</b><span>${e.location || ""}${ins ? " · " + ins : ""}</span><span class="s">${sec}</span></div>`
        });
        html += `<div class="row"><div class="lab">${d}</div><div class="track" style="height:${Math.max(1, lanes.length) * LANE}px">${blocks}</div></div>`
      });
      html += '</div></div><div class="note">مرّر الجدول أفقيًا لعرض باقي الساعات.</div>';
      out.innerHTML = html;
    }
    render();
  </script>
