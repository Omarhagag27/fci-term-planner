<!DOCTYPE html>
<html lang="ar" dir="rtl" data-accent="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a08">
<meta name="color-scheme" content="dark">
<meta name="description" content="FCI Term Planner: الجدول الدراسي وحاسبة المعدل التراكمي لطلاب كلية الحاسبات والمعلومات.">
<title>FCI Term Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060a08'/%3E%3Cpath d='M7 10l7 6-7 6' fill='none' stroke='%2339ff88' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 23h8' stroke='%2339ff88' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1 dir="ltr"><span class="d">$</span>fci-term-planner<span class="cursor" aria-hidden="true"></span></h1>
        <div class="sub">الفصل الدراسي الأول 2026-2027</div>
      </div>
      <div class="tools">
        <button class="who" id="who" type="button" hidden aria-label="تغيير الفرقة أو المجموعة أو السكشن"></button>
        <div class="accents" role="group" aria-label="لون الواجهة">
          <button type="button" data-accent="green" aria-label="أخضر"></button>
          <button type="button" data-accent="amber" aria-label="كهرماني"></button>
          <button type="button" data-accent="cyan" aria-label="سماوي"></button>
        </div>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="أيام الأسبوع" hidden></div>
  </div>
</header>

<nav class="nav" aria-label="الأقسام">
  <button type="button" id="nav-schedule" data-view="schedule" aria-selected="true"><span class="g" aria-hidden="true">&gt;</span>الجدول</button>
  <button type="button" id="nav-gpa" data-view="gpa" aria-selected="false"><span class="g" aria-hidden="true">&gt;</span>حاسبة المعدل</button>
</nav>

<main class="wrap">
  <section id="view-schedule" aria-label="الجدول الدراسي">
    <div class="picker" id="picker" hidden>
      <div class="step"><h2>الفرقة</h2><div class="chips" id="s1"></div></div>
      <div class="step" id="w2" hidden><h2>المجموعة / القسم</h2><div class="chips" id="s2"></div></div>
      <div class="step" id="w3" hidden><h2>السكشن</h2><div class="chips" id="s3"></div></div>
    </div>
    <div id="app" aria-live="polite">
      <div class="state"><p>جاري تحميل الجدول…</p></div>
    </div>
  </section>

  <section id="view-gpa" aria-label="حاسبة المعدل" hidden></section>
</main>

<noscript><div class="state"><p>الموقع يحتاج JavaScript ليعمل.</p></div></noscript>

<script src="js/utils.js"></script>
<script src="js/schedule.js"></script>
<script src="js/gpa.js"></script>
<script src="js/app.js"></script>
</body>
</html>
